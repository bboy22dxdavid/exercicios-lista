<div class="container">
  <div class="form-box">
    <!--chamando o metodo calcularResultados(), no forms atraves (ngSubmit)-->
    <form #frm="ngForm" (ngSubmit)="Resultados()">
      <h2>calculadora</h2>
      <!--INPUT DO PRIMEIRO NUMERO-->
      <label for="valorCarteira">Digite o valor da Carteiras de cigarro:</label>
      <input type="number" name="valorCarteira" id="valorCarteira"  [(ngModel)]="valorCarteira" >

      <!--INPUT DO SEGUNDO NUMERO-->
      <label for="qtdCarteira">Digite a QTD de carteiras fumada no dia:</label>
      <input type="number" name="qtdCarteira" id="qtdCarteira" [(ngModel)]="qtdCarteira">

       <!--INPUT DO SEGUNDO NUMERO-->
      <label for="anos">Digite a quantos anos Fuma:</label>
      <input type="number" name="anos" id="anos" [(ngModel)]="anos">

      <button type="submit">somar</button>
    </form>


    <!--iniciando a estrutura condicional-->
    @if(resultado){
      <!--DIV RESULTADO-->
      <div class="result-display">
        <p>Resultado: <span id="result">{{ resultado }}</span></p>
      </div>
    }@else {
      <div class="result-display">
        <p>Seu resultado aparecerá aqui.</p>
      </div>
    }
  </div>
</div>

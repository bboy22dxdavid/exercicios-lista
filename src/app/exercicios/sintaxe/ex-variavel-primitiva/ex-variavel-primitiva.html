<div class="container">
  <div class="form-box">
    <!--chamando o metodo calcularResultados(), no forms atraves (ngSubmit)-->
    <form #frm="ngForm" (ngSubmit)="Resultados()">
      <h2>Variavel primitiva</h2>
      <!--INPUT DO PRIMEIRO NOME-->
      <label for="nome">Digite seu Nome:</label>
      <input type="text" name="nome" id="nome"  [(ngModel)]="nome" >

      <!--INPUT DO ENDEREÇO-->
      <label for="endereco">Digite seu endereço:</label>
      <input type="text" name="endereco" id="endereco" [(ngModel)]="endereco">

       <!--INPUT DO SALARIO-->
      <label for="salario">Digite a data do seu salario: </label>
      <input type="number" name="salario" id="salario" [(ngModel)]="salario">

      <button type="submit">VALIDAR</button>
    </form>


    <!--iniciando a estrutura condicional-->
    @if(resultado){
      <!--DIV RESULTADO-->
      <div class="result-display">
        <p>Resultado: <span id="result">{{ resultado }}</span></p>
      </div>
    }@else {
      <div class="result-display">
        <p>Seu resultado aparecerá aqui.</p>
      </div>
    }
  </div>
</div>
